services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digitaltimeline
      POSTGRES_USER: dt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dt}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dt -d digitaltimeline"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports: ["7474:7474"]        # Neo4j Browser: see your graph at http://localhost:7474
    volumes: [neodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 8s
      retries: 15

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/digitaltimeline
      DB_USER: dt
      DB_PASSWORD: ${DB_PASSWORD:-dt}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      DT_GRAPH_STORE: neo4j
      JWT_SECRET: ${JWT_SECRET:-change-me-please-change-me-32-bytes-minimum!!}
      CORS_ORIGINS: http://localhost:3000
      DT_LLM_PROVIDER: ${DT_LLM_PROVIDER:-offline}           # anthropic | ollama | offline
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DT_EMBEDDING_PROVIDER: ${DT_EMBEDDING_PROVIDER:-hashing}   # hashing | ollama
      OLLAMA_URL: http://ollama:11434
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DT_ALLOWED_ROOTS: /app/sample-data
    volumes: ["./sample-data:/app/sample-data:ro"]
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

  # Optional fully-local AI:  docker compose --profile local-ai up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes: { pgdata: {}, neodata: {}, ollama: {} }
