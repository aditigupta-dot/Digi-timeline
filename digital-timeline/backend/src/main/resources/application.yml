spring:
  application:
    name: digital-timeline
  threads:
    virtual:
      enabled: true            # Tomcat + @Async run on Java 21 virtual threads
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digitaltimeline}
    username: ${DB_USER:dt}
    password: ${DB_PASSWORD:dt}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080

management:
  endpoints.web.exposure.include: health,info,metrics
  health.neo4j.enabled: true

dt:
  security:
    jwt-secret: ${JWT_SECRET:change-me-please-change-me-32-bytes-minimum!!}
    jwt-ttl: PT12H
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  graph:
    store: ${DT_GRAPH_STORE:neo4j}          # neo4j | memory
  ai:
    llm-provider: ${DT_LLM_PROVIDER:offline}          # anthropic | ollama | offline
    embedding-provider: ${DT_EMBEDDING_PROVIDER:hashing}   # ollama | hashing
    top-k: 8
    redact-pii: true
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
      max-tokens: 1200
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat-model: ${OLLAMA_CHAT_MODEL:llama3.1}
      embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
  link:
    min-weight: 0.33
    max-links-per-activity: 6
  collect:
    github-token: ${GITHUB_TOKEN:}
    auto-sync: false
    github-interval: PT30M
    allowed-roots: ${DT_ALLOWED_ROOTS:./sample-data}
  demo:
    seed: ${DT_SEED_DEMO:true}
  rate-limit:
    general-burst: 80
    general-per-second: 20
    ai-burst: 8
    ai-per-second: 0.2
